# ==============================================================
# Blooger - DevSecOps CI/CD Pipeline
# ==============================================================
# Triggers on every push and pull request.
# Stages: Lint -> SCA -> Dockerfile Lint -> Build+Scan+Push
# ==============================================================

name: Blooger DevSecOps Pipeline

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

# Security: restrict default permissions to read-only
permissions:
  contents: read

env:
  DOCKER_REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/blooger-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/blooger-frontend

jobs:
  # ==============================================================
  # STAGE 1: Linting
  # ==============================================================
  lint:
    name: "🔍 Lint Code"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]  # Dynamically creates two executions || Run linting for both backend & frontend components || Each gets its own Ubuntu GitHub-hosted runner
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "${{ matrix.component }}/package-lock.json"

      - name: Install dependencies
        working-directory: ${{ matrix.component }}
        run: npm ci

      - name: Run ESLint
        working-directory: ${{ matrix.component }}
        run: npm run lint

  # ==============================================================
  # STAGE 2: Software Composition Analysis (SCA) — Dependency Audit
  # ==============================================================
  sca:
    name: "🛡️ Dependency Audit"
    runs-on: ubuntu-latest
    # needs: lint
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "${{ matrix.component }}/package-lock.json"

      - name: Install dependencies
        working-directory: ${{ matrix.component }}
        run: npm ci

      # npm audit for known vulnerabilities (fail on high/critical)
      - name: npm audit
        working-directory: ${{ matrix.component }}
        run: npm audit --audit-level=high || true
        # `|| true` to not fail on high/critical — adjust in prod   || low / moderate / high / critical

  # ==============================================================
  # STAGE 3: Dockerfile Lint (Hadolint)
  # ==============================================================
  dockerfile-lint:
    name: "📋 Dockerfile Lint"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.component }}/Dockerfile
          failure-threshold: warning

  # ==============================================================
  # STAGE 4: Build -> Scan -> Push Container Images
  # ==============================================================
  # Design decision: build, scan, and push live in ONE job (not three
  # separate jobs) on purpose. Docker layers/images do not carry over
  # between jobs unless you explicitly cache or upload/download them as
  # artifacts — that's slow and wasteful for something as large as a
  # container image. Keeping them in one job means:
  #   1. We build the image ONCE.
  #   2. We scan that exact image (not a rebuilt copy).
  #   3. We push that exact scanned image — no drift between what was
  #      scanned and what actually ships.
  # Steps within a job always run sequentially, so "scan gates push"
  # falls out naturally without needing cross-job artifact passing.
  # ==============================================================
  build-scan-push:
    name: "🐳 Build, Scan & Push ${{ matrix.component }}"
    runs-on: ubuntu-latest
    # For now these run independent of lint/sca (matches your original
    # "run everything in parallel" setup for a portfolio project).
    # In a real prod pipeline you'd normally gate this behind the
    # earlier stages so a bad build doesn't burn registry storage:
    # needs: [lint, sca, dockerfile-lint]
    permissions:
      contents: read
      packages: write # Needed to push to GHCR
    strategy:
      matrix:
        component: [backend, frontend]
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/blooger-${{ matrix.component }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      # ----------------------------------------------------------
      # Build the image and LOAD it into the local Docker daemon
      # (push: false, load: true). This gives Trivy something real
      # to scan, tagged with the exact tags we intend to push,
      # WITHOUT publishing it to GHCR yet.
      # ----------------------------------------------------------
      - name: Build image (load locally for scanning)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          push: false
          load: true
          # Add a simple, predictable local-only tag alongside the real
          # registry tags from metadata-action. Trivy scans THIS tag
          # (simpler/more reliable than parsing a multiline tags string) —
          # it's the same image ID either way, just referenced differently.
          tags: |
            ${{ steps.meta.outputs.tags }}
            blooger-${{ matrix.component }}:scan
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----------------------------------------------------------
      # STAGE 4b: Container Image Scanning (Trivy)
      # Scans the image we just built and loaded above.
      # ----------------------------------------------------------
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "blooger-${{ matrix.component }}:scan"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          timeout: "10m"

      # ----------------------------------------------------------
      # PRODUCTION GATE (commented out for this portfolio project):
      # Uncomment to actually STOP the pipeline when Trivy finds
      # CRITICAL/HIGH vulnerabilities with a known fix available.
      # This is the standard "shift-left, but still gate at the door"
      # pattern — SCA/Lint catch things early, but the image scan is
      # the last checkpoint before anything reaches the registry.
      #
      # - name: Run Trivy (blocking mode)
      #   uses: aquasecurity/trivy-action@master
      #   with:
      #     image-ref: "blooger-${{ matrix.component }}:scan"
      #     format: "table"
      #     exit-code: "1"          # <-- non-zero exit fails the job/pipeline
      #     ignore-unfixed: true    # only fail on vulns that HAVE a fix
      #     vuln-type: "os,library"
      #     severity: "CRITICAL,HIGH"
      #     timeout: "10m"
      #
      # Notes for when you flip this on later:
      #   - ignore-unfixed: true means Trivy won't fail the build on
      #     CVEs with no patch yet (nothing actionable to do about those
      #     right now anyway) — avoids permanently red pipelines.
      #   - You'll also want a documented exception process (.trivyignore
      #     with a comment + expiry date) for CVEs the team has
      #     consciously accepted risk on, so people don't just quietly
      #     bypass this by lowering severity thresholds.
      #   - Consider uploading results as a SARIF file to GitHub's
      #     Security tab instead of/alongside "table" format, so findings
      #     show up in the repo's Security > Code scanning alerts UI:
      #       format: "sarif"
      #       output: "trivy-results.sarif"
      #     then a follow-up step: github/codeql-action/upload-sarif@v3
      # ----------------------------------------------------------

      # ----------------------------------------------------------
      # STAGE 4c: Push (only after the scan step above has run).
      # Because push: false + load: true was used earlier, the image
      # is already built and sitting in the local Docker daemon with
      # all the correct tags — so this just pushes those exact tags,
      # it does NOT trigger a rebuild.
      # ----------------------------------------------------------
      - name: Push image to GHCR
        if: github.event_name != 'pull_request'
        run: |
          for tag in $(echo "${{ steps.meta.outputs.tags }}"); do
            echo "Pushing $tag"
            docker push "$tag"
          done