services:
  # ---- PostgreSQL Database ----
  db:
    image: postgres:16-alpine
    container_name: blooger-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: blooger_user
      POSTGRES_PASSWORD: blooger_pass_2026
      POSTGRES_DB: blooger_db
      # env from .env file (uncomment if you want to use .env)
      # POSTGRES_USER: ${POSTGRES_USER}
      # POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"   # host port : container port
    volumes:
      - pgdata:/var/lib/postgresql/data    # mount a named volume for persistent data storage - managed by Docker at /var/lib/docker/volumes
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blooger_user -d blooger_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Security: read-only root filesystem where possible
    tmpfs:
      - /tmp
      - /run

  # ---- Backend API ----
  backend:
    image: akdevanurag/blooger:backend 
    # use build if you want to build the image from source instead of using a pre-built image
    # build:
    #   context: ./backend
    #   dockerfile: Dockerfile
    container_name: blooger-backend
    restart: unless-stopped
    environment:
      PORT: "8080"
      DB_USER: blooger_user
      DB_PASSWORD: blooger_pass_2026
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: blooger_db
      # env from .env file (uncomment if you want to use .env)
      # DB_USER: ${DB_USER}
      # DB_PASSWORD: ${DB_PASSWORD}
      # DB_HOST: ${DB_HOST}
      # DB_PORT: ${DB_PORT}
      # DB_NAME: ${DB_NAME}
      # PORT: ${PORT}
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    # Security: do not run as root (already in Dockerfile, but enforced here too)
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  # ---- Frontend (Nginx + React) ----
  frontend:
    image: akdevanurag/blooger:frontend
    # build:
    #   context: ./frontend
    #   dockerfile: Dockerfile
    container_name: blooger-frontend
    restart: unless-stopped
    ports:
      - "3000:80"         # host port : container port
    depends_on:
      - backend
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
    driver: local