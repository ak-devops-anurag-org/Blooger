# ---- Namespace ----
apiVersion: v1
kind: Namespace
metadata:
  name: blooger
  labels:
    app.kubernetes.io/part-of: blooger

---
# ---- Secret - PostgreSQL DB Secret ----
apiVersion: v1
kind: Secret
metadata:
  name: blooger-db-secret
  namespace: blooger
  labels:
    app.kubernetes.io/part-of: blooger
type: Opaque
stringData:
  POSTGRES_USER: jerney_user
  POSTGRES_PASSWORD: jerney_pass_2026 
  POSTGRES_DB: jerney_db
  # POSTGRES_DB: amVybmV5X2Ri | base64 → echo -n "jerney_db" 
  # POSTGRES_USER: amVybmV5X3VzZXI= | base64 → echo -n "jerney_user" 
  # POSTGRES_PASSWORD: amVybmV5X3Bhc3NfMjAyNg== | base64 → echo -n "jerney_pass_2026" 

--- 
# ---- PVC - PersistentVolumeClaim for PostgreSQL ----
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: blooger-db-pvc
  namespace: blooger
  labels:
    app.kubernetes.io/part-of: blooger
    app.kubernetes.io/component: database
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard       # on cloud, this is usually the default EBS storage class in AWS/ default managed disk in Azure
  resources:
    requests:
      storage: 1Gi                 

---
# ---- Deployment - PostgreSQL DB ----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blooger-db
  namespace: blooger
  labels:
    app.kubernetes.io/name: blooger-db
    app.kubernetes.io/part-of: blooger
    app.kubernetes.io/component: database
spec:
  replicas: 1
  strategy:
    type: Recreate # Required for RWO volumes
  selector:
    matchLabels:
      app.kubernetes.io/name: blooger-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blooger-db
        app.kubernetes.io/part-of: blooger
        app.kubernetes.io/component: database
    spec:
      # Security: don't automount service account token (DB doesn't need K8s API)
      automountServiceAccountToken: false 
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              protocol: TCP
          envFrom:
            - secretRef:
                name: blooger-db-secret
          volumeMounts:
            - name: db-storage
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Security context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # Postgres needs write access
            runAsNonRoot: false            # Postgres image runs initdb as root then drops
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "blooger_user", "-d", "blooger_db"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "blooger_user", "-d", "blooger_db"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: db-storage
          persistentVolumeClaim:
            claimName: blooger-db-pvc

---
# ---- Service - PostgreSQL Service (ClusterIP — internal only) ----
apiVersion: v1
kind: Service
metadata:
  name: blooger-db
  namespace: blooger
  labels:
    app.kubernetes.io/name: blooger-db
    app.kubernetes.io/part-of: blooger
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: blooger-db
  ports:
    - port: 5432                # service port 
      targetPort: 5432          # container port
      protocol: TCP

---
# ---- Deployment - Backend Deployment ----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blooger-backend
  namespace: blooger
  labels:
    app.kubernetes.io/name: blooger-backend
    app.kubernetes.io/part-of: blooger
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: blooger-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blooger-backend
        app.kubernetes.io/part-of: blooger
        app.kubernetes.io/component: backend
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for blooger-db:5432..."
              until nc -z blooger-db 5432; do
                echo "DB not ready, retrying in 3s..."
                sleep 3
              done
              echo "DB is ready!"
      containers:
        - name: backend
          image: akdevanurag/blooger:backend     
          # image: ghcr.io/iam-veeramalla/blooger/blooger-backend:75da1da akdevanurag/blooger:backend     
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: DB_HOST
              value: "blooger-db"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: blooger-db-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: blooger-db-secret
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: blooger-db-secret
                  key: POSTGRES_DB
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          # Security context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3

---
# ---- Service - Backend Service (ClusterIP — internal only) ----
apiVersion: v1
kind: Service
metadata:
  name: blooger-backend
  namespace: blooger
  labels:
    app.kubernetes.io/name: blooger-backend
    app.kubernetes.io/part-of: blooger
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: blooger-backend
  ports:
    - port: 8080          # service port
      targetPort: 8080    # container port
      protocol: TCP 

---
# ---- Deployment - Frontend Deployment ----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blooger-frontend
  namespace: blooger
  labels:
    app.kubernetes.io/name: blooger-frontend
    app.kubernetes.io/part-of: blooger
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: blooger-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blooger-frontend
        app.kubernetes.io/part-of: blooger
        app.kubernetes.io/component: frontend
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: akdevanurag/blooger:frontend
          # image: ghcr.io/iam-veeramalla/blooger/blooger-frontend:75da1da
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # Nginx needs write for cache/pid
            runAsNonRoot: true
            runAsUser: 101 # nginx user UID in alpine
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5

---
# ---- Frontend Service (NodePort — for access via port-forward or node IP) ----
# NOTE: Changed from LoadBalancer because this AWS account does not support
# creating load balancers. Use `kubectl port-forward svc/blooger-frontend 3000:80 -n blooger`
# to access the frontend locally.
apiVersion: v1
kind: Service
metadata:
  name: blooger-frontend
  namespace: blooger
  labels:
    app.kubernetes.io/name: blooger-frontend
    app.kubernetes.io/part-of: blooger
    app.kubernetes.io/component: frontend
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: blooger-frontend
  ports:
    - port: 80           # service port
      targetPort: 80     # container port
      protocol: TCP