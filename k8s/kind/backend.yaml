# ---- Backend Deployment ----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blooger-backend
  namespace: blooger
  labels:
    app.kubernetes.io/name: blooger-backend
    app.kubernetes.io/part-of: blooger
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: blooger-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blooger-backend
        app.kubernetes.io/part-of: blooger
        app.kubernetes.io/component: backend
    spec:
      automountServiceAccountToken: false
      # tolerations:
      #   - key: "karpenter.sh/disrupted"
      #     operator: "Exists"
      #     effect: "NoSchedule"
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for blooger-db:5432..."
              until nc -z blooger-db 5432; do
                echo "DB not ready, retrying in 3s..."
                sleep 3
              done
              echo "DB is ready!"
      containers:
        - name: backend
          image: akdevanurag/blooger:backend     
          # image: ghcr.io/iam-veeramalla/blooger/blooger-backend:75da1da akdevanurag/blooger:backend     
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: DB_HOST
              value: "blooger-db"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: blooger-db-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: blooger-db-secret
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: blooger-db-secret
                  key: POSTGRES_DB
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          # Security context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3

---
# ---- Backend Service (ClusterIP — internal only) ----
apiVersion: v1
kind: Service
metadata:
  name: blooger-backend
  namespace: blooger
  labels:
    app.kubernetes.io/name: blooger-backend
    app.kubernetes.io/part-of: blooger
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: blooger-backend
  ports:
    - port: 8080          # service port
      targetPort: 8080    # container port
      protocol: TCP 
